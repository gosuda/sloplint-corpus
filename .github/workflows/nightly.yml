name: nightly

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore sloplint cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sloplint
            ~/.cargo/git
            ~/.cargo/registry
          key: sloplint-d9d257c83580879f5b742ef7d78a3df202b317f4-${{ runner.os }}-${{ runner.arch }}
      - name: Install sloplint
        run: |
          set -euo pipefail
          if [ -x "${HOME}/.cargo/bin/sloplint" ]; then
            "${HOME}/.cargo/bin/sloplint" --version
            exit 0
          fi
          cargo install --git https://github.com/gosuda/sloplint --rev d9d257c83580879f5b742ef7d78a3df202b317f4 --locked
      - name: Verify committed trees
        run: python3 tools/corpus/corpus fetch --check
      - name: Measure every language with projects
        run: |
          python3 - <<'EOF'
          import json
          import subprocess
          out = subprocess.run(
              ["python3", "tools/corpus/corpus", "stats", "--format", "json"],
              capture_output=True, text=True, check=True)
          for lang, row in json.loads(out.stdout).items():
              if row["copied"] > 0:
                  subprocess.run(
                      ["python3", "tools/corpus/corpus", "measure", lang],
                      check=True)
          EOF
      - name: Show measurement reports
        if: always()
        run: |
          shopt -s nullglob
          for report in reports/*.json; do
            echo "--- $report"
            cat "$report"
          done
