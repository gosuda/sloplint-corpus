name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install askalono 0.5.0
        run: cargo install askalono-cli --version 0.5.0 --locked
      - name: Fail-closed license gate
        run: python3 tools/corpus/corpus verify --offline --expect-mode public
